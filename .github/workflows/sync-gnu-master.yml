name: Sync GNU Emacs master

on:
  schedule:
    # Run weekly on Mondays at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: emacs-mac-gnu_master_exp
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add GNU remote and fetch
        run: |
          git remote add gnu https://git.savannah.gnu.org/git/emacs.git
          git fetch gnu master

      - name: Attempt merge
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git merge gnu/master --no-edit -m "Merge GNU Emacs master into emacs-mac-gnu_master_exp"; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            # Capture conflicting files before aborting
            CONFLICTS=$(git diff --name-only --diff-filter=U | head -50)
            echo "conflicts<<CONFLICTS_EOF" >> "$GITHUB_OUTPUT"
            echo "$CONFLICTS" >> "$GITHUB_OUTPUT"
            echo "CONFLICTS_EOF" >> "$GITHUB_OUTPUT"
            git merge --abort
            echo "status=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Push if merged
        if: steps.merge.outputs.status == 'success'
        run: |
          # Only push if there are new commits from the merge
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/emacs-mac-gnu_master_exp)" ]; then
            git push origin emacs-mac-gnu_master_exp
          else
            echo "Already up to date, nothing to push."
          fi

      - name: Create PR for conflicts
        if: steps.merge.outputs.status == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="sync/gnu-master-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"

          # Redo the merge, leaving conflicts in place
          git merge gnu/master --no-edit || true

          # Commit the conflicted state
          git add -A
          git commit --no-verify -m "WIP: merge GNU master with conflicts"

          git push origin "$BRANCH"

          CONFLICTS="${{ steps.merge.outputs.conflicts }}"
          gh pr create \
            --base emacs-mac-gnu_master_exp \
            --head "$BRANCH" \
            --title "Sync GNU Emacs master (conflicts)" \
            --draft \
            --body "$(cat <<EOF
          ## GNU master sync — merge conflicts

          The automatic merge of GNU Emacs master encountered conflicts in the following files:

          \`\`\`
          $CONFLICTS
          \`\`\`

          ### To resolve locally
          \`\`\`sh
          git fetch origin $BRANCH
          git checkout $BRANCH
          # Resolve conflicts, then:
          git add -A && git commit
          git push origin $BRANCH
          \`\`\`

          Once resolved, mark this PR as ready for review and merge.
          EOF
          )"
