name: Sync GNU Emacs master

# Merge GNU Emacs master into nemesis once a week.  The merge is pushed to
# a sync/nemesis-DATE branch first and built on macOS (macos-build.yml);
# nemesis is updated only when that build passes.  A clean merge then
# fast-forwards nemesis; a conflicted one is resolved by Claude Code in a
# pull request, which is merged after the build.  A failed build leaves a
# draft pull request open for a human.

on:
  schedule:
    # Run weekly on Mondays at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.merge.outputs.status }}
      conflicts: ${{ steps.merge.outputs.conflicts }}
      branch: ${{ steps.branch.outputs.branch }}
      sha: ${{ steps.push-merged.outputs.sha }}
      pr_number: ${{ steps.create-pr.outputs.pr_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: nemesis
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add GNU remote and fetch
        run: |
          git remote add gnu https://git.savannah.gnu.org/git/emacs.git
          git fetch gnu master

      - name: Name the sync branch
        id: branch
        run: echo "branch=sync/nemesis-$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Attempt merge
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git merge gnu/master --no-edit -m "Merge GNU Emacs master"; then
            if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/nemesis)" ]; then
              echo "status=up-to-date" >> "$GITHUB_OUTPUT"
            else
              echo "status=success" >> "$GITHUB_OUTPUT"
            fi
          else
            # Capture conflicting files before aborting
            CONFLICTS=$(git diff --name-only --diff-filter=U | head -50)
            echo "conflicts<<CONFLICTS_EOF" >> "$GITHUB_OUTPUT"
            echo "$CONFLICTS" >> "$GITHUB_OUTPUT"
            echo "CONFLICTS_EOF" >> "$GITHUB_OUTPUT"
            git merge --abort
            echo "status=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Push clean merge for the macOS build
        id: push-merged
        if: steps.merge.outputs.status == 'success'
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          git push --force origin "HEAD:refs/heads/$BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create PR for conflicts
        id: create-pr
        if: steps.merge.outputs.status == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          git checkout -b "$BRANCH"

          # Redo the merge, leaving conflict markers in the files
          git merge gnu/master --no-edit || true

          # Commit the conflicted state
          git add -A
          git commit --no-verify -m "WIP: merge GNU master with conflicts"
          git push --force origin "$BRANCH"

          CONFLICTS="${{ steps.merge.outputs.conflicts }}"

          # Reuse existing PR or create a new one
          EXISTING_PR=$(gh pr list --base nemesis --head "$BRANCH" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            PR_NUMBER="$EXISTING_PR"
            gh pr comment "$PR_NUMBER" --body "$(cat <<EOF
          Retrying conflict resolution. Conflicting files:

          \`\`\`
          $CONFLICTS
          \`\`\`
          EOF
          )"
          else
            PR_URL=$(gh pr create \
              --base nemesis \
              --head "$BRANCH" \
              --title "Sync GNU Emacs master (conflicts)" \
              --draft \
              --body "$(cat <<EOF
          ## GNU master sync — merge conflicts

          The automatic merge of GNU Emacs master encountered conflicts in the following files:

          \`\`\`
          $CONFLICTS
          \`\`\`

          Claude Code will attempt to resolve these conflicts automatically.
          The PR is merged only if the macOS build passes afterwards.
          EOF
          )")
            PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

  resolve-conflicts:
    needs: sync
    if: needs.sync.outputs.status == 'conflict'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - name: Checkout conflict branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.branch }}
          fetch-depth: 0

      - name: Resolve conflicts with Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            This branch has merge conflicts from merging GNU Emacs master into
            the emacs-mac port branch. The conflicting files are:

            ${{ needs.sync.outputs.conflicts }}

            Please resolve all merge conflicts in these files. The conflict markers
            (<<<<<<< HEAD, =======, >>>>>>>) indicate where the conflicts are.

            Guidelines for resolving:
            - This is the emacs-mac port (a macOS-specific fork of GNU Emacs)
            - Prefer keeping BOTH sides of changes when possible (GNU upstream changes
              AND mac-port specific changes)
            - For mac-port specific code (inside #ifdef MAC_OS, HAVE_MACGUI, etc.),
              preserve the mac-port version while integrating any upstream structural changes
            - For files that are purely upstream (no mac-port changes), take the upstream version
            - Read AGENTS.md, especially "Merge Conflict Resolution" and the
              "Known conflict" notes: mac-only files and tables can need
              changes even where git reports no conflict.
            - After resolving, stage and commit the changes

            After resolving all conflicts, run: git add -A && git commit -m "Resolve merge conflicts from GNU master sync"
          claude_args: |
            --model claude-opus-4-6
            --max-turns 30
            --allowedTools Bash,Read,Edit,Write,Grep,Glob

      - name: Check and push the resolution
        id: push
        env:
          BRANCH: ${{ needs.sync.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            git add -u
            git commit --no-verify -m "Resolve merge conflicts from GNU master sync"
          fi
          git fetch origin nemesis
          # Conflict markers that the merge added and nothing removed.
          if git diff origin/nemesis HEAD | grep -nE '^\+(<<<<<<<|>>>>>>>)( |$)'; then
            echo "::error::Conflict markers remain after resolution."
            exit 1
          fi
          git push origin "HEAD:$BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  macos-build:
    needs: [sync, resolve-conflicts]
    # Run after a clean merge, or after a resolution that was pushed.
    if: >-
      always() &&
      (needs.sync.outputs.status == 'success' ||
       (needs.sync.outputs.status == 'conflict' &&
        needs.resolve-conflicts.result == 'success'))
    uses: ./.github/workflows/macos-build.yml
    with:
      ref: ${{ needs.sync.outputs.status == 'success' && needs.sync.outputs.sha || needs.resolve-conflicts.outputs.sha }}

  finish:
    needs: [sync, resolve-conflicts, macos-build]
    if: always() && needs.macos-build.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: nemesis
          fetch-depth: 0

      - name: Update nemesis after a clean merge
        if: needs.sync.outputs.status == 'success' && needs.macos-build.result == 'success'
        env:
          BRANCH: ${{ needs.sync.outputs.branch }}
          SHA: ${{ needs.sync.outputs.sha }}
        run: |
          # A plain push: it fails rather than overwrite nemesis if
          # nemesis moved while the build ran.
          git push origin "$SHA:refs/heads/nemesis"
          git push origin --delete "$BRANCH"

      - name: Merge the conflict PR
        if: needs.sync.outputs.status == 'conflict' && needs.macos-build.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.sync.outputs.pr_number }}
        run: |
          gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --merge --delete-branch

      - name: Report a failed build
        if: needs.macos-build.result != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ needs.sync.outputs.branch }}
          PR_NUMBER: ${{ needs.sync.outputs.pr_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MSG="The macOS build of this sync did not pass, so nemesis was not updated: $RUN_URL"
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$MSG"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" \
              --base nemesis --head "$BRANCH" --draft \
              --title "Sync GNU Emacs master (macOS build failed)" \
              --body "$MSG"
          fi
